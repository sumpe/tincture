<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frases portuguesas 🐟</title>
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19110c" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="../css/trainer.css">
<style>
:root{
  --accent:#2d6a4f;
  --fill:#2d6a4f;
  --fill-hi:#255a42;
  --tint:#dfe8dc;
  --ring:rgba(45,106,79,.22);
  --tag:#9c3a27;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --accent:#8cc7a4;
    --fill:#357a5a;
    --fill-hi:#3d8866;
    --tint:#22352a;
    --ring:rgba(140,199,164,.25);
    --tag:#eb9a84;
  }
}
:root[data-theme="dark"]{
  --accent:#8cc7a4;
  --fill:#357a5a;
  --fill-hi:#3d8866;
  --tint:#22352a;
  --ring:rgba(140,199,164,.25);
  --tag:#eb9a84;
}

/* Sentences rather than words: smaller type, and the answer box wraps */
textarea{font:inherit;color:inherit}
.en{margin:0 auto;max-width:100%;width:fit-content;font-weight:600;font-size:clamp(1.35rem,5.6vw,1.6rem);line-height:1.3;text-align:center;text-wrap:balance}
#ans{min-height:0;height:auto;font-size:1.25rem;line-height:1.35;text-align:left;resize:none}
.fb{text-align:left}
.fb .fa{font-size:1.12rem}
.fb .fix{display:block;margin-top:6px;color:var(--ink);font-size:.97rem;text-wrap:pretty}
.fb .rule{color:var(--muted);font-size:.94rem}
.fb .rule+.rule{margin-top:2px}
.fb .k{margin-top:6px}
#miss thead th:first-child{width:42%}
#tbl td{white-space:normal;vertical-align:baseline}
#tbl td:first-child{position:static;font-weight:400;color:var(--muted)}
#tbl th:first-child{position:static}
#tbl td:last-child{font-weight:600}
#setup .link{display:flex;justify-content:center;margin-top:10px}
.keys{--keys:12}
@media (max-width:480px){.keys{--keys:6}}
</style>
</head>
<body>
<nav class="nav" aria-label="Polyphrase"><div class="in">
  <a class="brand" href="../index.html">Polyphrase</a>
  <div class="langs">
    <a href="../portuguese/index.html" lang="pt-PT" aria-current="page" data-en="Portuguese"><span class="fl pt" aria-hidden="true"></span>Português</a>
  </div>
</div></nav>
<header class="mast"><div class="in">
  <h1 data-en="Portuguese Sentences">Frases portuguesas&nbsp;🐟</h1>
  <p class="sub" id="sub"></p>
  <nav class="tabs" aria-label="Secções">
    <a href="#game" id="tab-game" aria-current="page" data-en="Practice">Treino</a>
    <a href="#tables" id="tab-tables" data-en="Sentences">Frases</a>
  </nav>
</div></header>
<main>
  <section id="setup">
    <span class="lbl" id="l-var" data-en="Variety">Variante</span>
    <div class="seg" id="variant" role="group" aria-labelledby="l-var">
      <button data-v="pe" class="on" aria-pressed="true" data-en="European">Europeu</button>
      <button data-v="br" aria-pressed="false" data-en="Brazilian: you (informal) is você">Brasileiro</button>
    </div>
    <span class="lbl" id="l-t" data-en="Tense">Tempo</span>
    <div class="seg tight" id="tense" role="group" aria-labelledby="l-t">
      <button data-v="pres" aria-pressed="false" data-en="Present">Presente</button>
      <button data-v="pret" aria-pressed="false" data-en="Preterite">Pretérito</button>
      <button data-v="both" class="on" aria-pressed="true" data-en="Both">Os dois</button>
    </div>
    <p class="hint" id="about" aria-live="polite"></p>
    <span class="lbl" id="l-n" data-en="Number of sentences">Número de frases</span>
    <div class="seg" id="count" role="group" aria-labelledby="l-n">
      <button data-v="10" aria-pressed="false">10</button>
      <button data-v="20" class="on" aria-pressed="true">20</button>
      <button data-v="30" aria-pressed="false">30</button>
      <button data-v="40" aria-pressed="false">40</button>
    </div>
    <button class="primary" id="start" data-en="Start">Começar</button>
    <a class="link back" href="#tables" data-en="See every sentence">Ver todas as frases</a>
  </section>

  <section id="quiz" hidden>
    <div class="top"><span id="prog"></span><span id="score"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="ask" data-en="Translate">Traduz</p>
    <p class="en" id="en" lang="en"></p>
    <p class="case" id="tag"></p>
    <textarea id="ans" rows="3" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="A tua tradução"></textarea>
    <div class="keys" id="keys" role="group" aria-label="Letras com acento"></div>
    <div id="fb" class="fb" role="status" hidden></div>
    <button class="primary" id="go">Verificar</button>
  </section>

  <section id="done" hidden>
    <div id="res"></div>
    <div id="pct"></div>
    <p id="misshead" data-en="To review">Para rever</p>
    <table id="miss">
      <thead><tr><th scope="col" data-en="In English">Em inglês</th><th scope="col" data-en="You wrote, and the answer">Escreveste, e a resposta</th></tr></thead>
    </table>
    <button class="primary" id="again" data-en="Play again">Jogar outra vez</button>
    <button class="ghost" id="change" data-en="Change options">Alterar opções</button>
  </section>

  <section id="tbl-view" data-wide hidden>
    <p class="sub" data-en="Every sentence, with its usual translation.">Todas as frases, com a tradução habitual.</p>
    <span class="lbl" id="l-tvar" data-en="Variety">Variante</span>
    <div class="seg" id="tbl-variant" role="group" aria-labelledby="l-tvar">
      <button data-v="pe" class="on" aria-pressed="true" data-en="European">Europeu</button>
      <button data-v="br" aria-pressed="false" data-en="Brazilian: you (informal) is você">Brasileiro</button>
    </div>
    <div class="seg" id="ttense" role="group" aria-label="Tempo">
      <button data-v="pres" class="on" aria-pressed="true" data-en="Present">Presente</button>
      <button data-v="pret" aria-pressed="false" data-en="Preterite">Pretérito perfeito</button>
    </div>
    <p class="count" id="tcount"></p>
    <div class="tw"><table id="tbl"></table></div>
    <a class="link back" href="#game" data-en="Back to the game">Voltar ao jogo</a>
  </section>
</main>
<footer class="foot">By Peter S</footer>

<script src="../js/gloss.js"></script>
<script src="sentences.js"></script>
<script src="../js/trainer.js"></script>
<script src="check.js"></script>
<script src="app.js"></script>
</body>
</html>
